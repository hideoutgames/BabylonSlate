packages:
  - "apps/*"
  - "packages/*"

patchedDependencies:
  "@babylonjs/core@9.29.0": "patches/@babylonjs__core@9.29.0.patch"
  # XYFlow marks every edge `nopan`, so a drag or pinch starting on a wire never moves the canvas.
  "@xyflow/react@12.11.2": "patches/@xyflow__react@12.11.2.patch"

# Keep transitive security fixes within each consumer's supported release line.
overrides:
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "dompurify@>=3.0.0 <3.4.16": "3.4.16"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  # VitePress 1.6.4 is the latest release and pins Vite 5, which has no patched release.
  "vitepress>vite": "6.4.4"
  "undici@>=7.0.0 <7.29.1": "7.29.1"
