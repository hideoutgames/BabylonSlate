name: Inspect desktop packaging

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to inspect
        type: choice
        options: [all, windows, macos, linux]
        default: all
        required: true
      channel:
        description: Package identity channel
        type: choice
        options: [test, release]
        default: test
        required: true

permissions:
  contents: read

env:
  BABYLONSLATE_DISTRIBUTION: 'true'
  VITE_TEST_MODE: 'false'
  VITE_BASE_PATH: /
  # Git Bash must not rewrite the URL base to its Windows installation path.
  MSYS2_ENV_CONV_EXCL: VITE_BASE_PATH
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

defaults:
  run:
    shell: bash

jobs:
  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Generate non-publishable inspection identity
        run: node scripts/distribution/inspect-identity.mjs windows ${{ inputs.channel }}
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - run: pnpm --filter desktop package:windows
      - name: Exercise installed desktop package
        run: pnpm --filter desktop smoke:windows
      - name: List packaging evidence
        if: always()
        run: >-
          node -e "const fs=require('fs'); for (const dir of ['apps/desktop/dist/installers','apps/desktop/dist/public']) { console.log(dir + ':'); console.log(fs.existsSync(dir) ? fs.readdirSync(dir).sort().join('\\n') : '(missing)'); }"

  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Generate non-publishable inspection identity
        run: node scripts/distribution/inspect-identity.mjs macos ${{ inputs.channel }}
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - run: pnpm --filter desktop package:macos
      - name: Exercise installed desktop package
        run: pnpm --filter desktop smoke:macos
      - name: List packaging evidence
        if: always()
        run: >-
          node -e "const fs=require('fs'); for (const dir of ['apps/desktop/dist/installers','apps/desktop/dist/public']) { console.log(dir + ':'); console.log(fs.existsSync(dir) ? fs.readdirSync(dir).sort().join('\\n') : '(missing)'); }"

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Generate non-publishable inspection identity
        run: node scripts/distribution/inspect-identity.mjs linux ${{ inputs.channel }}
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - run: pnpm --filter desktop package:linux
      - name: Exercise installed desktop package
        run: xvfb-run -a pnpm --filter desktop smoke:linux
      - name: List packaging evidence
        if: always()
        run: >-
          node -e "const fs=require('fs'); for (const dir of ['apps/desktop/dist/installers','apps/desktop/dist/public']) { console.log(dir + ':'); console.log(fs.existsSync(dir) ? fs.readdirSync(dir).sort().join('\\n') : '(missing)'); }"
