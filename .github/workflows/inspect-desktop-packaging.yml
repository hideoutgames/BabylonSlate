name: Inspect desktop packaging

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to inspect
        type: choice
        options: [all, windows, macos, linux]
        default: all
        required: true
      channel:
        description: Package identity channel
        type: choice
        options: [test, release]
        default: test
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select requested desktop hosts
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          all='[{"platform":"windows","runner":"windows-2025"},{"platform":"macos","runner":"macos-26"},{"platform":"linux","runner":"ubuntu-24.04"}]'
          matrix=$(jq -c --arg p "$PLATFORM" '[.[] | select($p == "all" or .platform == $p)]' <<< "$all")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BABYLONSLATE_DISTRIBUTION: 'true'
      VITE_TEST_MODE: 'false'
      VITE_BASE_PATH: /
      # Git Bash must not rewrite the URL base to its Windows installation path.
      MSYS2_ENV_CONV_EXCL: VITE_BASE_PATH
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Generate non-publishable inspection identity
        run: node scripts/distribution/inspect-identity.mjs ${{ matrix.platform }} ${{ inputs.channel }}
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - run: pnpm --filter desktop package:${{ matrix.platform }}
      - name: Exercise Linux AppImage
        if: matrix.platform == 'linux'
        run: xvfb-run -a pnpm --filter desktop smoke:linux
      - name: Exercise installed desktop package
        if: matrix.platform != 'linux'
        run: pnpm --filter desktop smoke:${{ matrix.platform }}
      - name: List packaging evidence
        if: always()
        run: >-
          node -e "const fs=require('fs'); for (const dir of ['apps/desktop/dist/installers','apps/desktop/dist/public']) { console.log(dir + ':'); console.log(fs.existsSync(dir) ? fs.readdirSync(dir).sort().join('\\n') : '(missing)'); }"
