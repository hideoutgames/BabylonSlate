name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A dispatch on another ref gets its own group, so it cannot cancel a main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only main is published; a manual dispatch on another ref builds and deploys nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      editor_sha256: ${{ steps.digests.outputs.editor }}
      docs_sha256: ${{ steps.digests.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install
      - name: Build editor for GitHub Pages
        env:
          VITE_BASE_PATH: /BabylonSlate/
          VITE_TEST_MODE: "true"
        run: pnpm --filter editor build
      # Measurement only: no size thresholds, and a report failure never blocks deploy.
      - name: Report bundle sizes
        continue-on-error: true
        run: node scripts/bundle-report.mjs apps/player/dist apps/editor/dist >> "$GITHUB_STEP_SUMMARY"
      - name: Build docs site
        env:
          VITEPRESS_BASE: /BabylonSlate/docs/
        run: pnpm --filter docs-site build
      - name: Merge docs into Pages artifact
        run: |
          mkdir -p apps/editor/dist/docs
          cp -a apps/docs/.vitepress/dist/. apps/editor/dist/docs/
      # The smoke job compares the live pages with these exact uploaded files.
      - name: Record deployed index digests
        id: digests
        run: |
          echo "editor=$(sha256sum apps/editor/dist/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "docs=$(sha256sum apps/editor/dist/docs/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify GitHub Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh --jq takes one expression; do not pass jq's -r flag.
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')
          if [ "$build_type" != "workflow" ]; then
            source_branch=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch // "unknown"')
            echo "::error::GitHub Pages is using legacy branch deployment (build_type=$build_type, branch=$source_branch)."
            echo "The Preview workflow deploys the editor, but Pages is still serving Jekyll-rendered README.md from the repo root."
            echo "Fix: Settings → Pages → Build and deployment → Source → GitHub Actions"
            echo "https://github.com/${{ github.repository }}/settings/pages"
            exit 1
          fi
      # A unique query bypasses cached copies; only this run's uploaded page matches the digest.
      - name: Verify GitHub Pages deployment serves this build of the editor
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.editor_sha256 }}
        run: |
          url="https://hideoutgames.github.io/BabylonSlate/"
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /tmp/pages.html -w "%{http_code}" "$url?deployment=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt")
            actual=$(sha256sum /tmp/pages.html | cut -d' ' -f1)
            if [ "$status" = "200" ] && [ "$actual" = "$EXPECTED_SHA256" ]; then
              echo "Pages deployment verified at $url"
              exit 0
            fi
            echo "Attempt $attempt: status=$status, retrying in 15s..."
            sleep 15
          done
          echo "::error::Pages smoke check failed — the site is not serving this run's editor build."
          echo "Ensure GitHub Pages source is GitHub Actions (not Deploy from a branch):"
          echo "https://github.com/hideoutgames/BabylonSlate/settings/pages"
          exit 1
      - name: Verify GitHub Pages deployment serves this build of the docs site
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.docs_sha256 }}
        run: |
          url="https://hideoutgames.github.io/BabylonSlate/docs/"
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /tmp/docs.html -w "%{http_code}" "$url?deployment=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt")
            actual=$(sha256sum /tmp/docs.html | cut -d' ' -f1)
            if [ "$status" = "200" ] && [ "$actual" = "$EXPECTED_SHA256" ]; then
              echo "Docs deployment verified at $url"
              exit 0
            fi
            echo "Attempt $attempt: status=$status, retrying in 15s..."
            sleep 15
          done
          echo "::error::Pages smoke check failed — /docs/ is not serving this run's VitePress build."
          exit 1
