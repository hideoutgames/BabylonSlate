name: Inspect Android toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Sync and compile the Android debug shell
        run: pnpm --filter editor android:build
      - name: Confirm generated Gradle wiring was preserved
        run: git diff --exit-code -- apps/editor/android/capacitor.settings.gradle apps/editor/android/app/capacitor.build.gradle
      - name: Print Gradle and debug APK evidence
        working-directory: apps/editor/android
        run: |
          ./gradlew --version
          ls app/build/outputs/apk/debug
