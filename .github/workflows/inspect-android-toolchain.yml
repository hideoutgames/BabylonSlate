name: Inspect Android toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Sync and compile the Android debug shell
        run: pnpm --filter editor android:build
      - name: Confirm generated Gradle wiring was preserved
        run: git diff --exit-code -- apps/editor/android/capacitor.settings.gradle apps/editor/android/app/capacitor.build.gradle
      - name: Print Gradle and debug APK evidence
        working-directory: apps/editor/android
        run: |
          ./gradlew --version
          ls app/build/outputs/apk/debug
