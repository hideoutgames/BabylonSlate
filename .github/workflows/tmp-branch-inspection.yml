name: Temporary branch inspection

# Temporary copy of inspect-desktop-packaging.yml and inspect-android-toolchain.yml
# so they run on this branch before those workflows exist on main. Remove before merge.

on:
  push:
    branches: [agent/native-platforms-7e2a]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BABYLONSLATE_DISTRIBUTION: 'true'
      VITE_TEST_MODE: 'false'
      VITE_BASE_PATH: /
      # Git Bash must not rewrite the URL base to its Windows installation path.
      MSYS2_ENV_CONV_EXCL: VITE_BASE_PATH
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile
      - name: Generate non-publishable inspection identity
        run: node scripts/distribution/inspect-identity.mjs ${{ matrix.platform }} test
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - run: pnpm --filter desktop package:${{ matrix.platform }}
      - name: Exercise Linux AppImage
        if: matrix.platform == 'linux'
        run: xvfb-run -a pnpm --filter desktop smoke:linux
      - name: Exercise installed desktop package
        if: matrix.platform != 'linux'
        run: pnpm --filter desktop smoke:${{ matrix.platform }}
      - name: List packaging evidence
        if: always()
        run: >-
          node -e "const fs=require('fs'); for (const dir of ['apps/desktop/dist/installers','apps/desktop/dist/public']) { console.log(dir + ':'); console.log(fs.existsSync(dir) ? fs.readdirSync(dir).sort().join('\\n') : '(missing)'); }"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Sync and compile the Android debug shell
        run: pnpm --filter editor android:build
      - name: Confirm generated Gradle wiring was preserved
        run: git diff --exit-code -- apps/editor/android/capacitor.settings.gradle apps/editor/android/app/capacitor.build.gradle
      - name: Print Gradle and debug APK evidence
        working-directory: apps/editor/android
        run: |
          ./gradlew --version
          ls app/build/outputs/apk/debug

  ipados-build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler: 2.5.22
          bundler-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install locked CocoaPods
        run: |
          bundle config set --local deployment true
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Sync and compile the unsigned iPad simulator shell
        run: bundle exec pnpm --filter editor ios:build
      - name: Confirm CocoaPods lockfile was preserved
        run: git diff --exit-code -- apps/editor/ios/App/Podfile.lock
