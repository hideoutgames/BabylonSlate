name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BL_EXECUTION_POLICY: hosted-ci

jobs:
  # static + unit + 4 e2e shards = 6 jobs/PR. Two ready PRs = 12. After one
  # merges, remaining PR + main Verify + Preview = 13, below the 20-job cap.
  static:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test:tooling
      - run: pnpm test:distribution
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter docs-site build

  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # Unsharded: per-package coverage gates need the full Vitest suite.
      - run: pnpm test:coverage

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      # GitHub ubuntu-latest already ships Chromium's shared libraries.
      # Playwright's extra CJK/cyrillic font apt packages (~21MB) time out
      # when several shards hit the Ubuntu archive together. The suite has no
      # screenshot baselines that need those fonts.
      # Bundle on this runner; static remains independently required for merge.
      # The immutable build is verified before this shard executes its tests.
      - run: pnpm test:e2e --partition=${{ matrix.shard }}/4
        env:
          BL_TEST_BUILD_MODE: ci-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
