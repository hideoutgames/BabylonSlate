name: Distribute
run-name: Distribute ${{ inputs.channel }} / ${{ inputs.platforms }} / ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Test (Indev) or Release build action
        type: choice
        options: [test, release]
        default: test
        required: true
      platforms:
        description: Platforms to distribute
        type: choice
        options: [all, desktop, mobile, ipados, android, windows, macos, linux]
        default: all
        required: true
      source_sha:
        description: Exact source commit on protected main (blank uses the dispatch commit)
        type: string
        required: false
      version:
        description: Numeric version assertion matching release/version.json (for example 0.0.1)
        type: string
        required: true
      dry_run:
        description: Validate only; no native build, signing, upload or publication
        type: boolean
        default: true
        required: true
      operation:
        description: Build and distribute, or finalize an existing iPadOS upload without rebuilding
        type: choice
        options: [distribute, finalize-testflight]
        default: distribute
        required: true
      existing_build_number:
        description: Finalization only; original exact Apple build number (also select ipados and original source SHA)
        type: string
        required: false

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: babylonslate-distribution
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      identity: ${{ steps.request.outputs.identity }}
      dry_run: ${{ steps.request.outputs.dry_run }}
      windows: ${{ steps.request.outputs.windows }}
      macos: ${{ steps.request.outputs.macos }}
      linux: ${{ steps.request.outputs.linux }}
      android: ${{ steps.request.outputs.android }}
      ipados: ${{ steps.request.outputs.ipados }}
      github_release: ${{ steps.request.outputs.github_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Validate source, checks, versions and destinations
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_EXISTING_BUILD_NUMBER: ${{ inputs.existing_build_number }}
        run: node scripts/distribution/validate-request.mjs

  windows:
    name: Windows package and installed-app checks
    needs: [validate]
    if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.windows == 'true' && inputs.operation == 'distribute'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      identity: ${{ steps.metadata.outputs.identity }}
      artifact_name: windows-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      BABYLONSLATE_DISTRIBUTION: 'true'
      VITE_TEST_MODE: 'false'
      VITE_BASE_PATH: /
      # Public repository variable. Unset builds have no Clerk sign-in; mobile then offers only the demo account.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      # Git Bash must not rewrite the URL base to its Windows installation path.
      MSYS2_ENV_CONV_EXCL: VITE_BASE_PATH
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Generate actual Windows build identity
        id: metadata
        env:
          DISTRIBUTION_IDENTITY: ${{ needs.validate.outputs.identity }}
        run: node scripts/distribution/generate-metadata.mjs windows
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - name: Package unsigned NSIS installer without publication
        run: pnpm --filter desktop package:windows
      - name: Install and exercise packaged app with clean user data
        run: pnpm --filter desktop smoke:windows
      - name: Preserve only the public Windows deliverables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/dist/public/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos:
    name: macOS package and installed-app checks
    needs: [validate]
    if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.macos == 'true' && inputs.operation == 'distribute'
    runs-on: macos-26
    timeout-minutes: 60
    environment: macos-signing
    outputs:
      identity: ${{ steps.metadata.outputs.identity }}
      artifact_name: macos-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      BABYLONSLATE_DISTRIBUTION: 'true'
      VITE_TEST_MODE: 'false'
      VITE_BASE_PATH: /
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Generate actual macOS build identity
        id: metadata
        env:
          DISTRIBUTION_IDENTITY: ${{ needs.validate.outputs.identity }}
          MACOS_SIGNING_AVAILABLE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' }}
        run: node scripts/distribution/generate-metadata.mjs macos
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - name: Package DMG/ZIP (signed and notarized only when credentials are provisioned)
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: pnpm --filter desktop package:macos
      - run: pnpm --filter desktop smoke:macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/dist/public/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux:
    name: Linux package and installed-app checks
    needs: [validate]
    if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.linux == 'true' && inputs.operation == 'distribute'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      identity: ${{ steps.metadata.outputs.identity }}
      artifact_name: linux-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      BABYLONSLATE_DISTRIBUTION: 'true'
      VITE_TEST_MODE: 'false'
      VITE_BASE_PATH: /
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Generate actual Linux build identity
        id: metadata
        env:
          DISTRIBUTION_IDENTITY: ${{ needs.validate.outputs.identity }}
        run: node scripts/distribution/generate-metadata.mjs linux
      - run: pnpm --filter editor build
      - run: pnpm --filter desktop build:host
      - run: pnpm --filter desktop package:linux
      - run: xvfb-run -a pnpm --filter desktop smoke:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/dist/public/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android:
    name: Android signed release APK
    needs: [validate]
    if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.android == 'true' && inputs.operation == 'distribute'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-signing
    outputs:
      identity: ${{ steps.metadata.outputs.identity }}
      artifact_name: android-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      BABYLONSLATE_DISTRIBUTION: 'true'
      VITE_TEST_MODE: 'false'
      VITE_BASE_PATH: /
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Generate actual Android build identity
        id: metadata
        env:
          DISTRIBUTION_IDENTITY: ${{ needs.validate.outputs.identity }}
        run: node scripts/distribution/generate-metadata.mjs android
      - run: pnpm --filter editor android:sync
      - name: Confirm generated Gradle wiring was preserved
        run: git diff --exit-code -- apps/editor/android/capacitor.settings.gradle apps/editor/android/app/capacitor.build.gradle
      - name: Sign release APK and verify package identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm --filter editor android:release
      - name: Always remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP"/babylonslate-android-*.jks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/editor/android/dist/public/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ipados:
    name: iPadOS archive, sign and direct upload
    needs: [validate]
    if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.ipados == 'true' && inputs.operation == 'distribute'
    runs-on: macos-26
    timeout-minutes: 75
    environment: testflight
    outputs:
      identity: ${{ steps.metadata.outputs.identity }}
      uploaded: ${{ steps.archive.outputs.uploaded }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BABYLONSLATE_DISTRIBUTION: 'true'
      VITE_TEST_MODE: 'false'
      VITE_BASE_PATH: /
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler: 2.5.22
          bundler-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install locked CocoaPods and Fastlane before importing credentials
        run: |
          bundle config set --local deployment true
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Validate selected Xcode and locked tools
        env:
          APPLE_TOOLCHAIN_FILE: ${{ runner.temp }}/apple-toolchains.json
        run: node scripts/distribution/apple-toolchain.mjs
      - name: Generate actual iPadOS build identity
        id: metadata
        env:
          DISTRIBUTION_IDENTITY: ${{ needs.validate.outputs.identity }}
          APPLE_TOOLCHAIN_FILE: ${{ runner.temp }}/apple-toolchains.json
        run: node scripts/distribution/generate-metadata.mjs ipados
      - name: Build editor/player and preserve custom Capacitor plugin registrations
        run: bundle exec pnpm --filter editor ios:sync
      - name: Confirm CocoaPods lockfile was preserved
        run: git diff --exit-code -- apps/editor/ios/App/Podfile.lock
      - name: Validate, archive, sign, export and upload directly
        id: archive
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
          APPLE_TEST_GROUP_ID: ${{ vars.APPLE_TEST_GROUP_ID }}
          APPLE_RELEASE_GROUP_ID: ${{ vars.APPLE_RELEASE_GROUP_ID }}
          APPLE_PRIVACY_REVIEWED_VERSION: ${{ vars.APPLE_PRIVACY_REVIEWED_VERSION }}
          APPLE_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.APPLE_USES_NON_EXEMPT_ENCRYPTION }}
        run: pnpm --filter editor ios:archive
      - name: Always remove Apple credentials and private outputs
        if: always()
        run: node scripts/distribution/apple-cleanup.mjs

  testflight:
    name: TestFlight processing and private group assignment
    needs: [validate, ipados]
    if: always() && needs.validate.result == 'success' && needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.ipados == 'true' && (needs.ipados.outputs.uploaded == 'true' || inputs.operation == 'finalize-testflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testflight
    outputs:
      state: ${{ steps.finalize.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install publication dependencies without package lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Finalize exact existing upload; never rebuild or reupload
        id: finalize
        env:
          APPLE_IDENTITY: ${{ needs.ipados.outputs.identity || needs.validate.outputs.identity }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
          APPLE_TEST_GROUP_ID: ${{ vars.APPLE_TEST_GROUP_ID }}
          APPLE_RELEASE_GROUP_ID: ${{ vars.APPLE_RELEASE_GROUP_ID }}
        run: node scripts/distribution/finalize-testflight.mjs

  publish-release:
    name: Validate and publish shared GitHub Release
    needs: [validate, windows, macos, linux, android, ipados, testflight]
    if: always() && needs.validate.result == 'success' && needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.github_release == 'true' && (needs.validate.outputs.windows != 'true' || needs.windows.result == 'success') && (needs.validate.outputs.macos != 'true' || needs.macos.result == 'success') && (needs.validate.outputs.linux != 'true' || needs.linux.result == 'success') && (needs.validate.outputs.android != 'true' || needs.android.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install publication dependencies without package lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: needs.validate.outputs.windows == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: release-public/windows
      - if: needs.validate.outputs.macos == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.macos.outputs.artifact_name }}
          path: release-public/macos
      - if: needs.validate.outputs.linux == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.linux.outputs.artifact_name }}
          path: release-public/linux
      - if: needs.validate.outputs.android == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.android.outputs.artifact_name }}
          path: release-public/android
      - name: Publish only verified immutable deliverables
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IDENTITY: ${{ needs.validate.outputs.identity }}
          APPLE_STATE: ${{ needs.testflight.outputs.state || 'failed' }}
        run: node scripts/distribution/publish-release.mjs release-public

  summary:
    name: Sanitized platform outcomes
    needs: [validate, windows, macos, linux, android, ipados, testflight, publish-release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report results without private artifacts or logs
        env:
          DISTRIBUTION_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/distribution/summary.mjs
