name: WebKit Smoke

# Optional Safari-engine smoke lane. It is not a pull-request check and must
# not be made required: PR Verify keeps its six jobs per ready PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webkit-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BL_EXECUTION_POLICY: hosted-ci

jobs:
  webkit:
    # macOS, not Linux: Playwright's Linux WebKit has no origin-private file
    # system (navigator.storage is undefined), so the editor cannot create a
    # project there. The macOS build is the engine Safari and iPadOS ship.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install
      # One job, so only WebKit is downloaded; Chromium is not.
      - name: Install Playwright WebKit
        timeout-minutes: 10
        run: pnpm exec playwright install webkit
      - run: pnpm test:e2e:webkit
        env:
          BL_TEST_BUILD_MODE: ci-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: webkit-smoke-results
          path: test-results/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
