name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download gitleaks
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan the working tree for secrets
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        run: ./gitleaks git . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}" --config .gitleaks.toml --redact --no-banner

      - name: Scan main history for secrets
        if: github.event_name == 'push'
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: Check tracked public-repository content
        run: node scripts/check-public-hygiene.mjs

      - name: Check pull request additions
        if: github.event_name == 'pull_request'
        run: node scripts/check-public-hygiene.mjs --range "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
