name: Security

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]

permissions:
  contents: read

# Each comment and review keeps its own run; only an edit of the same text supersedes it.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download gitleaks
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan the working tree for secrets
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        run: ./gitleaks git . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --config .gitleaks.toml --redact --no-banner

      - name: Scan pushed commits for secrets
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="$HEAD_SHA^!"
          else
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi
          ./gitleaks git . --log-opts="$RANGE" --config .gitleaks.toml --redact --no-banner

      - name: Check tracked content and issue or pull request text
        run: node scripts/check-public-hygiene.mjs --event "$GITHUB_EVENT_PATH"

      # Every commit's additions, so content added and later removed on the branch is caught.
      - name: Check pull request commit additions and messages
        if: github.event_name == 'pull_request'
        run: node scripts/check-public-hygiene.mjs --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="$HEAD_SHA^!"
          else
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi
          node scripts/check-public-hygiene.mjs --commits "$RANGE"
