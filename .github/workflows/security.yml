name: Security

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-hygiene:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download gitleaks
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan the working tree for secrets
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        run: ./gitleaks git . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --config .gitleaks.toml --redact --no-banner

      - name: Scan pushed commits for secrets
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="$HEAD_SHA^!"
          else
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi
          ./gitleaks git . --log-opts="$RANGE" --config .gitleaks.toml --redact --no-banner

      - name: Check tracked content and pull request metadata
        run: node scripts/check-public-hygiene.mjs --event "$GITHUB_EVENT_PATH"

      - name: Check pull request additions and commit messages
        if: github.event_name == 'pull_request'
        run: node scripts/check-public-hygiene.mjs --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="$HEAD_SHA^!"
          else
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi
          node scripts/check-public-hygiene.mjs --commits "$RANGE"
