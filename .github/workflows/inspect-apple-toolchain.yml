name: Inspect Apple toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Validate the pinned Xcode and SDK without distribution dependencies
        run: node scripts/distribution/apple-toolchain.mjs --inspect-xcode
      - name: Validate native project and entitlement property lists
        run: plutil -lint apps/editor/ios/App/App.xcodeproj/project.pbxproj apps/editor/ios/App/App/App.entitlements
      - name: Read installed Xcode version, SDK and public command help
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -help

  ipados-build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler: 2.5.22
          bundler-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install locked CocoaPods
        run: |
          bundle config set --local deployment true
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Sync and compile the unsigned iPad simulator shell
        run: bundle exec pnpm --filter editor ios:build
      - name: Confirm CocoaPods lockfile was preserved
        run: git diff --exit-code -- apps/editor/ios/App/Podfile.lock
