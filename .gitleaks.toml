# gitleaks configuration for a public repository.
#
# Scope: gitleaks owns generic credential detection (keys, tokens, certificates).
# Repository-specific policy — agent session links, Apple signing identifiers — is
# enforced by scripts/check-public-hygiene.mjs instead, because those are not
# secrets in gitleaks' sense and would need custom rules that duplicate it.
#
# The default ruleset is inherited rather than replaced: an allowlist that is
# wider than necessary is the one way this file can cause a leak, so every entry
# below is scoped to a path, not to a rule-wide regex.

title = "BabylonSlate"

[extend]
useDefault = true

[[rules]]
id = "apple-provisioning-profile"
description = "Embedded Apple provisioning profile or signing certificate"
regex = '''(?i)-----BEGIN (CERTIFICATE|PKCS7|ENCRYPTED PRIVATE KEY)-----'''
tags = ["apple", "signing"]

[[rules]]
id = "netrc-credentials"
description = "netrc-style credentials"
regex = '''(?i)machine\s+\S+\s+login\s+\S+\s+password\s+\S+'''
tags = ["credentials"]

[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "Two public SHA-256 build artifacts in retained renderer evidence, including commit history"
  condition = "AND"
  regexTarget = "match"
  paths = ['''^docs/assets/renderer-qualification/2026-09-22-(stock|shared-outline)/web(gl2|gpu)\.json$''']
  regexes = ['''^buildKey":\s*"(9543eab34dc8365e1c59ee0b5d7eee9abed340f468d75c575e8c153caeb4c5b9|5ed00cf36afd408b3c33a38fec982e640be153b44b47b75f8e3e85f8f9277875)"$''']

[allowlist]
description = "Binary test fixtures"
# Text lockfiles and `.gltf` JSON stay scanned because they can contain
# authenticated URLs and arbitrary metadata.
paths = [
  # Binary fixtures (glb, wav, woff2, png, ktx2, basis) are scanned as text and
  # produce entropy noise. They are committed art/audio assets, not config.
  # Deliberately excludes `.env` — an environment map extension collision with
  # dotenv files is not worth the hole. Use `.hdr` for those instead.
  '''(?i)\.(glb|bin|wav|mp3|ogg|woff2?|ttf|png|jpe?g|webp|ktx2|basis|dds|hdr)$''',
]
