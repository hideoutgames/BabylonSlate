<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Haptic</title>
    <link
      rel="preload"
      href="/fonts/licensed/block-berthold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- COOP/COEP via coi-serviceworker so SharedArrayBuffer may activate on Pages. -->
    <script src="/coi-serviceworker.js"></script>
    <script>
      // Haptic is dark only.
      document.documentElement.classList.add("dark");
      // Set before the intro is parsed, so an automated browser never paints
      // its layers (see .haptic-intro below).
      if (navigator.webdriver)
        document.documentElement.setAttribute("data-automation", "");
    </script>
    <style>
      /* The haptic.no title face, for the text wordmark of the boot intro and
       * the project-open card. */
      @font-face {
        font-family: "Block Berthold";
        src: url("/fonts/licensed/block-berthold.woff2") format("woff2");
        font-weight: 400 900;
        font-style: normal;
        font-display: block;
      }
      /* The boot intro: the animated wordmark alone on black. This page paints
       * it outside #root before any bundle runs; LauncherTransitionProvider
       * then drives the same element (useBootIntro) and removes it at once
       * when the boot ends, so it never restarts mid-flight and never fades.
       * The letters animate only transform and opacity, which the compositor
       * keeps smooth while the bundle evaluates. */
      html:has(.haptic-intro),
      html:has(.haptic-intro) body {
        background: #000;
      }
      .haptic-intro {
        --hi-amber: 255 179 0;
        --hi-red: 255 68 0;
        --hi-ease: cubic-bezier(0.22, 0.8, 0.28, 1);
        --hi-wordmark-width: clamp(150px, 28vw, 440px);
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
        color: #fff;
        font:
          400 11px "Onest Variable",
          system-ui,
          sans-serif;
        cursor: progress;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Automated browsers (navigator.webdriver) keep the cover, its timing
       * and its status but paint no wordmark. Headless software rendering
       * queues the animated letters faster than it can draw them,
       * and works through that backlog long after the intro has gone,
       * delaying every scene load and screenshot that follows. */
      html[data-automation] .haptic-intro > :not(.haptic-intro-status) {
        display: none;
      }
      /* The wordmark is text, set like haptic.no's title: white ink over a red
       * and an amber copy stretched a little wider, which leave the chromatic
       * fringes. The letters rise out of the baseline one after another while
       * the copies close in from wide to their resting stretch; only
       * transforms and opacity animate. The letters carry no filter: WebKit
       * draws filtered text as a bitmap, soft while it animates and repainted
       * differently when the animation ends. */
      .haptic-intro-wordmark {
        --t: calc(var(--hi-wordmark-width) / 3.3 / 172.5);
        position: relative;
        margin: 0;
        font: 400 calc(172.5 * var(--t)) / 1 "Block Berthold", "Onest Variable",
          system-ui, sans-serif;
        letter-spacing: 0;
        white-space: nowrap;
        clip-path: inset(-0.45em -0.45em 0);
      }
      /* Until the font can paint (data-wait), the letters hold their first
       * frame instead of rising invisibly. */
      .haptic-intro[data-wait] .haptic-intro-wordmark,
      .haptic-intro[data-wait] .haptic-intro-wordmark * {
        animation-play-state: paused;
      }
      .haptic-intro-ink {
        position: relative;
        display: block;
        color: #fff;
      }
      .haptic-intro-ca {
        position: absolute;
        inset: 0;
        transform: scaleX(var(--ca));
        animation: haptic-intro-converge 1700ms var(--hi-ease) 400ms backwards;
      }
      .haptic-intro-ca-red {
        --ca: 1.075;
        --ca-from: 1.34;
        color: rgb(var(--hi-red));
      }
      .haptic-intro-ca-amber {
        --ca: 1.04;
        --ca-from: 1.2;
        color: rgb(var(--hi-amber));
      }
      .haptic-intro-wordmark span > span {
        display: inline-block;
        animation: haptic-intro-rise 1100ms var(--hi-ease)
          calc(400ms + var(--i) * 85ms) backwards;
      }
      .haptic-intro-wordmark span > span:nth-child(1) { --i: 0; }
      .haptic-intro-wordmark span > span:nth-child(2) { --i: 1; }
      .haptic-intro-wordmark span > span:nth-child(3) { --i: 2; }
      .haptic-intro-wordmark span > span:nth-child(4) { --i: 3; }
      .haptic-intro-wordmark span > span:nth-child(5) { --i: 4; }
      .haptic-intro-wordmark span > span:nth-child(6) { --i: 5; }
      .haptic-intro-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes haptic-intro-rise {
        0% {
          opacity: 0;
          transform: translateY(115%);
        }
        30% {
          opacity: 1;
        }
      }
      @keyframes haptic-intro-converge {
        0% {
          opacity: 0;
          transform: scaleX(var(--ca-from));
        }
        25% {
          opacity: 1;
        }
      }
      /* Without animations every layer shows its resting state. */
      @media (prefers-reduced-motion: reduce) {
        .haptic-intro * {
          animation: none !important;
        }
      }
      @media (forced-colors: active) {
        .haptic-intro-ca {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="haptic-intro"
      class="slate-loading haptic-intro"
      role="status"
      aria-live="polite"
      aria-label="Loading Haptic"
    >
      <div class="haptic-intro-wordmark" aria-hidden="true">
        <span class="haptic-intro-ca haptic-intro-ca-red"><span>H</span><span>A</span><span>P</span><span>T</span><span>I</span><span>C</span></span>
        <span class="haptic-intro-ca haptic-intro-ca-amber"><span>H</span><span>A</span><span>P</span><span>T</span><span>I</span><span>C</span></span>
        <span class="haptic-intro-ink"><span>H</span><span>A</span><span>P</span><span>T</span><span>I</span><span>C</span></span>
      </div>
      <span class="haptic-intro-status">Loading application</span>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var intro = document.getElementById("haptic-intro");
        if (!intro) return;
        // The timeline starts with the first frame, and the launcher counts its
        // minimum time from data-start. If the wordmark font is not loaded yet
        // (a cold start), the letters wait for it; its load can be queued
        // behind the bundle, which the black cover hides meanwhile.
        intro.setAttribute("data-start", String(performance.now()));
        var face = '400 100px "Block Berthold"';
        if (document.fonts && !document.fonts.check(face)) {
          intro.setAttribute("data-wait", "");
          var release = function () {
            if (!intro.hasAttribute("data-wait")) return;
            intro.removeAttribute("data-wait");
            intro.setAttribute("data-start", String(performance.now()));
          };
          document.fonts.load(face).then(release, release);
        }

      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
