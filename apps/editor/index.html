<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Haptic</title>
    <!-- COOP/COEP via coi-serviceworker so SharedArrayBuffer may activate on Pages. -->
    <script src="/coi-serviceworker.js"></script>
    <script>
      // Haptic is dark only.
      document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        body:has(#slate-boot) {
          background: oklch(0.145 0.004 75);
        }
        #slate-boot {
          position: fixed;
          inset: 0;
          z-index: 1000;
          display: grid;
          place-items: center;
          padding: 24px;
          background: oklch(0.145 0.004 75);
          color: oklch(0.97 0.002 85);
          will-change: opacity;
          opacity: 1;
          transition: opacity 650ms cubic-bezier(0.22, 0.61, 0.36, 1);
          font:
            400 12px "Onest Variable",
            system-ui,
            sans-serif;
        }
        #slate-boot[data-leaving="true"] {
          opacity: 0;
          pointer-events: none;
        }
        .slate-splash {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          width: min(320px, 100%);
          animation: slate-splash-in 500ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }
        .slate-splash-wordmark {
          width: auto;
          height: 44px;
          object-fit: contain;
        }
        .slate-splash-text {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          min-height: 34px;
          max-width: 100%;
          text-align: center;
        }
        .slate-loading-label {
          max-width: 100%;
          overflow: hidden;
          font-size: 14px;
          font-weight: 600;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .slate-splash-status {
          color: oklch(0.71 0.006 80);
          font-size: 12px;
        }
        .slate-loading-track {
          display: block;
          width: 160px;
          height: 2px;
          overflow: hidden;
          border-radius: 2px;
          background: oklch(1 0 0 / 10%);
        }
        .slate-loading-track > span {
          display: block;
          width: 40%;
          height: 100%;
          background: linear-gradient(90deg, transparent, oklch(0.97 0.002 85), transparent);
          will-change: transform;
          animation: slate-load-travel 1.6s ease-in-out infinite;
        }
        .slate-loading-track[data-ready="true"] > span {
          width: 100%;
          background: oklch(0.97 0.002 85);
          animation: none;
        }
        .slate-splash-version {
          position: absolute;
          right: 12px;
          bottom: 8px;
          color: oklch(0.71 0.006 80);
          font-size: 11px;
        }
        @keyframes slate-load-travel {
          from {
            transform: translateX(-110%);
          }
          to {
            transform: translateX(350%);
          }
        }
        @keyframes slate-splash-in {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #slate-boot,
          #slate-boot * {
            animation: none;
            transition: none;
          }
        }

      </style>
      <div id="slate-boot" role="status" aria-label="Loading Haptic">
        <section class="slate-splash">
          <img class="slate-splash-wordmark" src="/branding/HapticWordmark-DarkMode.png" alt="" />
          <div class="slate-splash-text">
            <span class="slate-splash-status">Loading application</span>
          </div>
          <span class="slate-loading-track" aria-hidden="true"><span></span></span>
        </section>
        <span class="slate-splash-version">__SLATE_BUILD_LABEL__</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
