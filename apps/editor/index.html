<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Haptic</title>
    <!-- COOP/COEP via coi-serviceworker so SharedArrayBuffer may activate on Pages. -->
    <script src="/coi-serviceworker.js"></script>
    <script>
      // Haptic is dark only.
      document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        body:has(#slate-boot) {
          background: oklch(0.12 0.004 75);
        }
        #slate-boot {
          position: fixed;
          inset: 0;
          z-index: 1000;
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          place-items: center;
          padding: 16px;
          background: oklch(0.125 0.004 75);
          color: oklch(0.97 0.002 85);
          will-change: opacity;
          opacity: 1;
          transition: opacity 500ms cubic-bezier(0.22, 0.61, 0.36, 1);
          font:
            400 12px "Onest Variable",
            system-ui,
            sans-serif;
        }
        #slate-boot[data-leaving="true"] {
          opacity: 0;
          pointer-events: none;
        }
        /* A flat splash card: the wordmark on top, then the progress line with the
         * status and build under it. */
        .slate-splash {
          box-sizing: border-box;
          position: relative;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          width: min(460px, 100%);
          aspect-ratio: 2 / 1;
          padding: 28px 28px 26px;
          overflow: hidden;
          border: 1px solid oklch(1 0 0 / 8%);
          border-radius: 16px;
          background: oklch(0.175 0.004 75);
          transition: transform 500ms cubic-bezier(0.22, 0.61, 0.36, 1);
          animation: slate-splash-in 500ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }
        #slate-boot[data-leaving="true"] .slate-splash {
          transform: scale(0.98);
        }
        .slate-splash-wordmark {
          align-self: flex-start;
          width: auto;
          height: 34px;
          aspect-ratio: 1119 / 257;
          object-fit: contain;
        }
        .slate-splash-bottom {
          display: flex;
          flex-direction: column;
          gap: 14px;
          min-width: 0;
        }
        .slate-splash-footer {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 16px;
          min-width: 0;
        }
        .slate-splash-text {
          display: flex;
          flex-direction: column;
          gap: 2px;
          min-width: 0;
        }
        .slate-loading-label {
          min-width: 0;
          overflow: hidden;
          font-size: 13px;
          font-weight: 500;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .slate-splash-status {
          color: oklch(0.97 0.002 85 / 60%);
          font-size: 12px;
        }
        .slate-splash-version {
          flex-shrink: 0;
          color: oklch(0.97 0.002 85 / 40%);
          font-size: 11px;
        }
        .slate-loading-track {
          position: relative;
          display: block;
          height: 2px;
          overflow: hidden;
          border-radius: 2px;
          background: oklch(1 0 0 / 10%);
        }
        .slate-loading-track > span {
          position: absolute;
          inset: 0 auto 0 0;
          width: 35%;
          background: linear-gradient(
            90deg,
            transparent,
            oklch(0.83 0.16 75) 35%,
            oklch(0.66 0.21 32) 70%,
            transparent
          );
          will-change: transform;
          animation: slate-load-travel 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        .slate-loading-track[data-ready="true"] > span {
          width: 100%;
          background: oklch(0.97 0.002 85);
          animation: slate-load-fill 400ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }
        @keyframes slate-splash-in {
          from {
            opacity: 0;
            transform: translateY(8px) scale(0.98);
          }
        }
        @keyframes slate-load-travel {
          from {
            transform: translateX(-100%);
          }
          to {
            transform: translateX(290%);
          }
        }
        @keyframes slate-load-fill {
          from {
            transform: scaleX(0);
            transform-origin: left;
          }
          to {
            transform-origin: left;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #slate-boot,
          #slate-boot * {
            animation: none;
            transition: none;
          }
        }

      </style>
      <div id="slate-boot" role="status" aria-label="Loading Haptic">
        <section class="slate-splash">
          <img class="slate-splash-wordmark" src="/branding/HapticWordmark-DarkMode.png" alt="" />
          <div class="slate-splash-bottom">
            <span class="slate-loading-track" aria-hidden="true"><span></span></span>
            <div class="slate-splash-footer">
              <div class="slate-splash-text">
                <span class="slate-splash-status">Loading application</span>
              </div>
              <span class="slate-splash-version">__SLATE_BUILD_LABEL__</span>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
