<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Slate</title>
    <!-- COOP/COEP via coi-serviceworker so SharedArrayBuffer may activate on Pages. -->
    <script src="/coi-serviceworker.js"></script>
    <script>
      (function () {
        var preference = "system";
        try {
          var raw = localStorage.getItem("babylonslate:engine-settings");
          if (raw) {
            var parsed = JSON.parse(raw);
            var theme = parsed && parsed.appearance && parsed.appearance.theme;
            if (theme === "light" || theme === "dark" || theme === "system") {
              preference = theme;
            }
          }
        } catch (e) {
          /* ignore */
        }
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark =
          preference === "dark" || (preference !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        #slate-boot {
          position: fixed;
          inset: 0;
          z-index: 1000;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 32px;
          background: #090b10;
          color: #f1f2f7;
          opacity: 1;
          transition: opacity 420ms ease;
          isolation: isolate;
        }
        #slate-boot[data-scheme="light"] {
          background: #f0f1f5;
          color: #171b29;
        }
        #slate-boot::before {
          content: "";
          position: absolute;
          inset: 0;
          z-index: -1;
          background: radial-gradient(
            ellipse at 50% 47%,
            #6c76ae16,
            transparent 44%
          );
        }
        #slate-boot[data-leaving="true"] {
          opacity: 0;
          pointer-events: none;
        }
        #slate-boot .slate-loading-mark {
          position: relative;
          width: 140px;
          height: 164px;
          display: grid;
          place-items: center;
          margin-bottom: 12px;
        }
        #slate-boot .slate-loading-mark::before,
        #slate-boot .slate-loading-mark::after {
          content: "";
          position: absolute;
          inset: 8px 15px;
          border: 1px solid #929eb72a;
          border-radius: 24px;
          background: linear-gradient(140deg, #9aa7da09, transparent 65%);
          transform: rotate(-12deg) translate(-12px, 2px);
          animation: slate-load-drift 4s ease-in-out infinite alternate;
        }
        #slate-boot .slate-loading-mark::after {
          transform: rotate(12deg) translate(12px, -2px);
          animation-direction: alternate-reverse;
        }
        #slate-boot .slate-loading-mark img {
          position: relative;
          z-index: 1;
          width: 64px;
          height: 64px;
          object-fit: contain;
        }
        #slate-boot .slate-loading-label {
          font:
            500 14px system-ui,
            sans-serif;
          letter-spacing: 0.12em;
          max-width: 65vw;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        #slate-boot .slate-loading-track {
          height: 2px;
          width: 112px;
          overflow: hidden;
          background: #929eb71c;
          border-radius: 2px;
        }
        #slate-boot .slate-loading-track span {
          display: block;
          width: 45%;
          height: 100%;
          background: linear-gradient(
            90deg,
            transparent,
            currentColor,
            transparent
          );
          opacity: 0.65;
          animation: slate-load-travel 1.8s ease-in-out infinite;
        }
        @keyframes slate-load-travel {
          from {
            transform: translateX(-120%);
          }
          to {
            transform: translateX(340%);
          }
        }
        @keyframes slate-load-drift {
          to {
            transform: rotate(0deg) translate(0, 0);
            border-color: #929eb75a;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #slate-boot,
          #slate-boot *,
          #slate-boot .slate-loading-mark::before,
          #slate-boot .slate-loading-mark::after {
            animation: none;
            transition: none;
          }
        }
      </style>
      <div id="slate-boot" role="status" aria-label="Loading Slate">
        <div class="slate-loading-mark">
          <img src="/branding/SlateIconLight.png" alt="" />
        </div>
        <span class="slate-loading-label">Slate</span>
        <span class="slate-loading-track" aria-hidden="true"
          ><span></span
        ></span>
      </div>
      <script>
        try {
          if (localStorage.getItem("slate:launcher-scheme") === "light") {
            var boot = document.getElementById("slate-boot");
            boot.dataset.scheme = "light";
            boot.querySelector("img").src = boot
              .querySelector("img")
              .src.replace("SlateIconLight", "SlateIconDark");
          }
        } catch (e) {
          /* The default dark splash remains usable. */
        }
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
