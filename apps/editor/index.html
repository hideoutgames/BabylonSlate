<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>editor</title>
    <!-- COOP/COEP via coi-serviceworker so SharedArrayBuffer may activate on Pages. -->
    <script src="/coi-serviceworker.js"></script>
    <script>
      (function () {
        var preference = "system";
        try {
          var raw = localStorage.getItem("babylonslate:engine-settings");
          if (raw) {
            var parsed = JSON.parse(raw);
            var theme = parsed && parsed.appearance && parsed.appearance.theme;
            if (theme === "light" || theme === "dark" || theme === "system") {
              preference = theme;
            }
          }
        } catch (e) {
          /* ignore */
        }
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark =
          preference === "dark" || (preference !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
