appId: no.hideout.babylonslate
productName: BabylonSlate
electronVersion: 44.6.0
directories:
  app: dist/app
  output: dist/installers
files:
  - package.json
  - host/*.cjs
  - renderer/**/*
asar: true
npmRebuild: false
publish:
  provider: github
  owner: hideoutgames
  repo: BabylonSlate
  channel: latest
  releaseType: release
artifactName: BabylonSlate-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
mac:
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  sign: false
linux:
  target:
    - { target: AppImage, arch: [x64] }
  artifactName: BabylonSlate-${version}-x64.${ext}
  category: Development
  executableName: babylonslate
  maintainer: Hideout Games
  synopsis: BabylonSlate editor
  syncDesktopName: true
